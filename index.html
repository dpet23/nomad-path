<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPS tracks over Google 3D Tiles</title>
  <style>
    :root {
      --surface: #1a1a19;
      --page: #0d0d0d;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --ink-muted: #898781;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: var(--page);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
    }
    #map { position: absolute; inset: 0; }

    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      width: min(300px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow-y: auto;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; font-size: 13px; line-height: 1.45;
      backdrop-filter: blur(6px);
    }
    #panel h1 { font-size: 15px; margin: 0 8px 8px 0; padding-right: 32px; font-weight: 600; }

    #panel-toggle {
      position: absolute; top: 8px; right: 8px; z-index: 1;
      width: 40px; height: 40px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      background: #2a2a28; border: 1px solid var(--border); border-radius: 8px;
      color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer;
    }
    #panel-toggle:hover { background: #383835; }
    /* Collapsed: hide the body, shrink the panel to just the toggle button. */
    #panel.collapsed { width: auto; padding: 6px; overflow: visible; }
    #panel.collapsed #panel-body { display: none; }
    #panel.collapsed #panel-toggle { position: static; }
    #panel .hint { color: var(--ink-muted); font-size: 12px; margin: 6px 0; }

    .file-btn {
      display: inline-block; cursor: pointer;
      background: #2a2a28; border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 12px; font-size: 13px; color: var(--ink);
    }
    .file-btn:hover { background: #383835; }
    .file-btn input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; }

    #stats { color: var(--ink-2); font-size: 12px; margin-top: 8px; }
    #banner {
      display: none; margin-top: 10px; padding: 8px 10px; border-radius: 6px;
      background: #3a2f1a; border: 1px solid #6b5518; color: #f0d9a0; font-size: 12px;
    }
    #banner.error { background: #3a1a1a; border-color: #6b1818; color: #f0a0a0; }

    #controls { display: none; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
    #controls label { display: block; margin: 8px 0; color: var(--ink-2); }
    #controls .row { display: flex; align-items: center; gap: 8px; }
    #controls input[type="range"] { flex: 1; accent-color: #3987e5; }
    #controls input[type="checkbox"] { accent-color: #3987e5; }
    #offset-value, #exag-value { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }

    #legend { display: none; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
    #legend .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; color: var(--ink-2); }
    #legend .swatch { width: 14px; height: 4px; border-radius: 2px; flex: none; }
    #legend .count { margin-left: auto; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

    /* Google requires its logo and the per-tile data credits wherever tiles are
       drawn — so the bar appears with the tiles and not before. Laying the two
       out together is what stops a long credit line from running under the logo
       on a narrow screen. */
    #credits {
      display: none; position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
      align-items: flex-end; justify-content: space-between;
      /* The 10dp / 5dp clear space the logo must keep around it. */
      gap: 10px; padding: 0 12px 5px 10px;
      pointer-events: none;
    }
    body.has-tiles #credits { display: flex; }
    /* Height only, never both dimensions: the asset is 105x22 with the 18dp
       logo inset inside its own border, and the aspect ratio must not change. */
    #google-logo { height: 22px; width: auto; flex: none; }
    #attribution {
      text-align: right; font-size: 11px; color: #ffffff;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
    }

    #drop-overlay {
      display: none; position: absolute; inset: 0; z-index: 20;
      background: rgba(13, 13, 13, 0.7); border: 3px dashed #3987e5;
      align-items: center; justify-content: center;
      font-size: 20px; color: var(--ink); pointer-events: none;
    }
    body.dragging #drop-overlay { display: flex; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <button id="panel-toggle" type="button" aria-controls="panel-body" aria-expanded="true" aria-label="Hide controls">✕</button>
    <div id="panel-body">
    <h1>GPS tracks over Google 3D Tiles</h1>
    <label class="file-btn">Open a track…<input type="file" id="file-input" accept=".gpx,.kml,.geojson,.json,.xml,application/gpx+xml,application/vnd.google-earth.kml+xml,application/geo+json,application/json" /></label>
    <div class="hint">…or drag &amp; drop a trip-data.geojson anywhere on the page.</div>
    <div id="stats"></div>
    <div id="banner"></div>

    <div id="controls">
      <label>
        Elevation offset
        <span class="row">
          <input type="range" id="offset" min="-100" max="200" step="1" value="0" />
          <span id="offset-value">0 m</span>
        </span>
      </label>
      <label>
        Elevation exaggeration
        <span class="row">
          <input type="range" id="exag" min="1" max="5" step="0.1" value="1" />
          <span id="exag-value">×1.0</span>
        </span>
      </label>
      <label class="row" id="clamp-row" style="display:none">
        <input type="checkbox" id="clamp" />
        Clamp tracks to 3D surface (ignores GPS elevation; tracks stay hidden until tiles load)
      </label>
      <label class="row">
        <input type="checkbox" id="xray" />
        X-ray (draw tracks through terrain)
      </label>
    </div>

    <div id="legend"></div>
    </div>
  </div>

  <div id="credits">
    <img id="google-logo" src="/GoogleMaps_Logo_WithDarkOutline.svg" alt="Google Maps" width="105" height="22" />
    <div id="attribution"></div>
  </div>
  <div id="drop-overlay">Drop GeoJSON to load</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

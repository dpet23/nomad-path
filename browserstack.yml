  #   browserName: safari
  #   deviceOrientation: portrait # 12.9", 2048x2732, 265 ppi

  # Phone: Android, Samsung Browser

  - deviceName: Samsung Galaxy S24 Ultra
    osVersion: 14.0
    browserName: samsung
    deviceOrientation: landscape # 6.8", 3120x1440, 505 ppi

  # Tablet: Android, Samsung Browser

  - deviceName: Samsung Galaxy Tab S8

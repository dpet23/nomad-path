# Nomad Path preprocessing configuration
#
# Group settings (under groups.<folder>):
#   hidden                true|false — hidden at map load
#   excludeFromAutoBounds true|false — excluded from map viewport fit
#
# POI settings (under poi_categories.<category>):
#   hidden                true|false — hidden at map load
#
# Other:
#   ignore                list of glob patterns anchored to the input root,
#                         skipped during scan and watch (use **/ for any-depth)

groups:
  # <<subdirs>>

poi_categories:
  poi:
    hidden: true

ignore:
  - .git/
  - .ignore/
  - '**/.DS_Store'
  - '**/Thumbs.db'

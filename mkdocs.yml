site_name: Nomad Path
site_description: Visualise GPS trip recordings on interactive basemaps

# Internal working docs (superpowers specs/plans for agentic workers) may land
# under docs/ for proximity to the code; keep them out of the published build so
# a stray plan file never fails `mkdocs build --strict`. (exclude_docs is
# mkdocs-only - revisit when switching to zensical, once it reaches parity.)
exclude_docs: |
  superpowers/

theme:
  name: material

nav:
  - Home: index.md
  - Usage:
      - Getting started: usage/getting-started.md
      - Configuration: usage/configuration.md
  - Architecture:
      - Overview: architecture/overview.md
      - Pipeline: architecture/pipeline.md
      - Data contract: architecture/data-contract.md
      - UI core: architecture/ui-core.md

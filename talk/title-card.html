<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomad Path — Turning GPS Recordings into Travel Stories</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧭</text></svg>">
<style>
  :root {
    /* Sunset travel-poster palette — cream is INK on a saturated ground, not the paper */
    --night:  #14122c;
    --indigo: #2c1b4e;
    --plum:   #6d2a64;
    --rose:   #c23c69;
    --coral:  #ee6c4d;
    --amber:  #f4a93b;
    --gold:   #f4c96b;
    --sun:    #ffd98a;
    --cream:  #fbeeda;
    --teal:   #37c2b6;
    --ink:    #1a1330;

    --font-display: "Futura", "Century Gothic", "Avenir Next", ui-rounded,
                    system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
                  "Times New Roman", serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(120% 70% at 50% 118%, rgba(255,217,138,.55) 0%, rgba(255,217,138,0) 45%),
      linear-gradient(180deg,
        var(--night)  0%,
        var(--indigo) 24%,
        var(--plum)   47%,
        var(--rose)   66%,
        var(--coral)  80%,
        var(--amber)  92%,
        var(--gold)  100%);
    color: var(--cream);
    font-family: var(--font-sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    cursor: default;
  }

  /* Soft deco sun-rays fanning up from the horizon, behind everything */
  .rays {
    position: fixed;
    left: 50%; bottom: -8vmin;
    width: 160vmax; height: 160vmax;
    transform: translateX(-50%);
    background: repeating-conic-gradient(from 90deg at 50% 100%,
      rgba(255,224,168,.10) 0deg 4deg, rgba(255,224,168,0) 4deg 12deg);
    -webkit-mask-image: radial-gradient(60% 60% at 50% 100%, #000 0%, transparent 72%);
            mask-image: radial-gradient(60% 60% at 50% 100%, #000 0%, transparent 72%);
    pointer-events: none;
    z-index: 0;
    animation: shimmer 14s ease-in-out infinite alternate;
  }
  @keyframes shimmer { from { opacity: .75; } to { opacity: 1; } }

  /* Soft poster vignette: darkens the ground behind the title block to lift text contrast.
     Sits below the tracks canvas, so the routes stay vibrant while the gradient behind the
     text is dimmed. */
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(72% 55% at 50% 50%, rgba(16,12,34,.40), rgba(16,12,34,0) 75%);
  }

  /* The map: GPS tracks tracing themselves on */
  #tracks {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* Double-rule poster frame */
  .frame {
    position: fixed;
    inset: clamp(14px, 2.4vmin, 30px);
    border: 1.5px solid rgba(251,238,218,.85);
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    animation: fadeIn 1s ease .1s forwards;
  }
  .frame::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(251,238,218,.4);
  }
  .frame span {
    position: absolute;
    color: var(--cream);
    font-size: clamp(.7rem, 1.6vmin, 1rem);
    opacity: .8;
  }
  .frame .tl { top: 10px; left: 12px; }
  .frame .tr { top: 10px; right: 12px; }
  .frame .bl { bottom: 8px; left: 12px; }
  .frame .br { bottom: 8px; right: 12px; }

  /* Content column */
  .content {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8vmin 6vw;
    gap: clamp(.7rem, 1.8vmin, 1.4rem);
  }

  .eyebrow {
    font-family: var(--font-sans);
    font-weight: 600;
    letter-spacing: .46em;
    text-indent: .46em;
    font-size: clamp(.68rem, 1.7vw, 1.02rem);
    color: var(--gold);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 1.1em;
  }
  .eyebrow::before, .eyebrow::after {
    content: "";
    width: clamp(24px, 6vw, 74px);
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .eyebrow::after { background: linear-gradient(90deg, var(--gold), transparent); }

  .title {
    font-family: var(--font-display);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .1em;
    text-indent: .1em;
    line-height: .92;
    font-size: clamp(3rem, 12.5vw, 10rem);
    margin: 0;
    color: var(--cream);
    text-shadow: 0 2px 30px rgba(20,10,40,.45), 0 1px 2px rgba(20,10,40,.5);
    text-wrap: balance;
  }

  .rule {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    color: var(--sun);
    font-size: clamp(1rem, 2.6vw, 1.7rem);
  }
  .rule::before, .rule::after {
    content: "";
    width: clamp(40px, 12vw, 150px);
    height: 1px;
    background: currentColor;
    opacity: .7;
  }

  .subtitle {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.15rem, 3.4vw, 2.35rem);
    color: var(--cream);
    max-width: 22ch;
    line-height: 1.25;
    text-shadow: 0 0 2px rgba(16,12,34,.85), 0 1px 3px rgba(16,12,34,.8), 0 2px 20px rgba(16,12,34,.5);
    text-wrap: balance;
  }

  .byline {
    position: fixed;
    right: clamp(26px, 4vmin, 46px);
    bottom: clamp(22px, 3.4vmin, 40px);
    z-index: 3;
    font-family: var(--font-serif);
    font-style: italic;
    font-size: clamp(.72rem, 1.5vw, 1rem);
    color: var(--ink);
    opacity: .85;
  }

  /* Entrance choreography */
  .reveal { opacity: 0; animation: riseIn .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay: .25s; }
  .d2 { animation-delay: .5s; }
  .d3 { animation-delay: .8s; }
  .d5 { animation-delay: 2.6s; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .reveal, .frame { animation: none; opacity: 1; }
    .rays { animation: none; }
  }
</style>
</head>
<body>
  <div class="rays"></div>
  <div class="scrim"></div>
  <canvas id="tracks"></canvas>

  <div class="frame">
    <span class="tl">✦</span><span class="tr">✦</span>
    <span class="bl">✦</span><span class="br">✦</span>
  </div>

  <main class="content">
    <div class="eyebrow reveal d1">A Lightning Talk</div>
    <h1 class="title reveal d2">Nomad&nbsp;Path</h1>
    <div class="rule reveal d3">✶</div>
    <p class="subtitle reveal d3">Turning GPS recordings into travel stories</p>
  </main>

  <div class="byline reveal d5">Daniel Petrescu</div>

<script>
(() => {
  const canvas = document.getElementById('tracks');
  const ctx = canvas.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Deterministic RNG so the poster looks identical every run (good for a talk).
  const mulberry32 = (a) => () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const TRACK_COLORS = ['#fbeeda', '#37c2b6', '#ffe28a', '#a8346a'];
  let W = 0, H = 0, dpr = 1, tracks = [], flight = null, unit = 1;

  // --- track-shape generators: each reads like a real kind of GPS movement ---

  // straight-ish leg between two waypoints, with slight cross-track GPS jitter
  function leg(a, b, n, amp, rng, out) {
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) + Math.PI / 2;
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const j = (rng() - 0.5) * amp;
      out.push([a[0] + (b[0]-a[0])*t + Math.cos(ang)*j,
                a[1] + (b[1]-a[1])*t + Math.sin(ang)*j]);
    }
  }

  // road trip: legs between waypoints with sharp turns at each
  function makeRoad(rng, wps, per, amp) {
    const out = [];
    for (let i = 0; i < wps.length - 1; i++) leg(wps[i], wps[i+1], per, amp, rng, out);
    return out;
  }

  // smooth quadratic curve (coastal drive / flight arc)
  function bez(a, c, b, steps) {
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const t = i/steps, mt = 1 - t;
      pts.push([mt*mt*a[0] + 2*mt*t*c[0] + t*t*b[0],
                mt*mt*a[1] + 2*mt*t*c[1] + t*t*b[1]]);
    }
    return pts;
  }

  // hiking switchbacks climbing from start to end
  function makeHike(rng, start, end, switches, width) {
    const dx = end[0]-start[0], dy = end[1]-start[1];
    let px = -dy, py = dx; const pl = Math.hypot(px, py) || 1; px /= pl; py /= pl;
    const verts = [], segs = switches * 2;
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const taper = 1 - Math.abs(t - 0.5) * 1.2;           // narrow near ends
      const side = (i % 2 ? 1 : -1) * width * (0.55 + rng()*0.45) * Math.max(0.15, taper);
      verts.push([start[0] + dx*t + px*side, start[1] + dy*t + py*side]);
    }
    return densify(verts, 3, 2.4 * unit, rng);
  }

  // town exploration: dense wander held near a centre
  function makeCluster(rng, c, steps, radius) {
    const pts = []; let ang = rng()*6.28, x = c[0], y = c[1];
    for (let i = 0; i < steps; i++) {
      pts.push([x, y]);
      ang += (rng() - 0.5) * 1.5;
      const step = radius * (0.12 + rng()*0.16);
      x += Math.cos(ang)*step + (c[0]-x)*0.06;
      y += Math.sin(ang)*step + (c[1]-y)*0.06;
    }
    return pts;
  }

  function densify(pts, per, amp, rng) {
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      for (let k = 0; k < per; k++) {
        const t = k / per;
        out.push([pts[i][0] + (pts[i+1][0]-pts[i][0])*t + (rng()-0.5)*amp,
                  pts[i][1] + (pts[i+1][1]-pts[i][1])*t + (rng()-0.5)*amp]);
      }
    }
    out.push(pts[pts.length - 1]);
    return out;
  }

  // bottom edge of the tagline in viewport px — tracks stay strictly below this
  function taglineBottom() {
    const el = document.querySelector('.subtitle');
    if (!el) return H * 0.6;
    const b = el.getBoundingClientRect().bottom;
    return (b > 0 && b < H) ? b : H * 0.6;
  }

  function build() {
    const rng = mulberry32(20260710);
    unit = Math.min(W, H) / 560;   // scale off the shorter side so ultrawide doesn't inflate vertical wander

    // Confine every track to a band BELOW the tagline so nothing crosses the text.
    const inset = Math.min(30, Math.max(14, 0.024 * Math.min(W, H)));   // matches the CSS frame inset
    const pad = inset + 6 + 22 * unit;                                  // inner rule + glow/pin allowance
    const bandTop = Math.min(H * 0.72, taglineBottom() + Math.max(26, 0.045 * H));
    const bandBottom = H - pad;
    const bandH = Math.max(40, bandBottom - bandTop);
    const P = (fx, fy) => [W * fx, bandTop + fy * bandH];   // fy in [0,1] within the track band

    tracks = [
      // road trip — straight legs, sharp turns
      { pts: makeRoad(rng, [P(.10,.55),P(.19,.42),P(.24,.64),P(.34,.48),P(.40,.68),P(.47,.5)], 9, 5*unit),
        color: TRACK_COLORS[0], w: 2.4 },
      // coastal drive — long smooth curve
      { pts: bez(P(.54,.5), P(.74,1.0), P(.93,.62), 60),
        color: TRACK_COLORS[1], w: 2.3 },
      // hike — switchbacks climbing
      { pts: makeHike(rng, P(.66,.92), P(.72,.42), 6, 24*unit),
        color: TRACK_COLORS[2], w: 2.1 },
      // town exploration — dense wander
      { pts: makeCluster(rng, P(.28,.84), 54, 34*unit),
        color: TRACK_COLORS[3], w: 1.9 },
    ];
    // flight arc across the top of the band (nods to the FlightAware data)
    flight = { pts: bez(P(.12,.34), P(.5,.02), P(.88,.28), 50), color: '#fbeeda', w: 1.6 };

    // hard-clamp everything inside the band + frame, on any aspect ratio
    const xMin = pad, xMax = W - pad;
    const clamp = (p) => {
      p[0] = Math.max(xMin, Math.min(xMax, p[0]));
      p[1] = Math.max(bandTop, Math.min(bandBottom, p[1]));
    };
    tracks.forEach((tr) => tr.pts.forEach(clamp));
    flight.pts.forEach(clamp);
  }

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  function strokePartial(pts, count, color, w, dashed) {
    if (count < 2) return;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = w * unit;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.shadowColor = color;
    ctx.shadowBlur = 14 * unit;
    if (dashed) ctx.setLineDash([2 * unit, 7 * unit]);
    ctx.globalAlpha = dashed ? 0.75 : 0.92;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < count; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
    ctx.restore();
  }

  // dark underlay so a coloured line separates from the bright background (projector legibility)
  function strokeUnder(pts, count, w) {
    if (count < 2) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(16,12,34,0.5)';
    ctx.lineWidth = (w + 1.7) * unit;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < count; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
    ctx.restore();
  }

  function pin(p, color) {
    ctx.save();
    ctx.shadowColor = color; ctx.shadowBlur = 12 * unit;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(p[0], p[1], 3.4 * unit, 0, 7); ctx.fill();
    ctx.globalAlpha = .5; ctx.lineWidth = 1.4 * unit; ctx.strokeStyle = color;
    ctx.beginPath(); ctx.arc(p[0], p[1], 7 * unit, 0, 7); ctx.stroke();
    ctx.restore();
  }

  function draw(p) {
    ctx.clearRect(0, 0, W, H);
    tracks.forEach((tr, i) => {
      const local = Math.max(0, Math.min(1, (p * 1.25) - i * 0.06));
      const n = Math.floor(local * tr.pts.length);
      strokeUnder(tr.pts, n, tr.w);
      strokePartial(tr.pts, n, tr.color, tr.w, false);
      if (local >= 1) { pin(tr.pts[0], tr.color); pin(tr.pts[tr.pts.length-1], tr.color); }
    });
    const fp = Math.max(0, Math.min(1, (p - 0.15) / 0.85));
    const fn = Math.floor(fp * flight.pts.length);
    strokePartial(flight.pts, fn, flight.color, flight.w, true);
    if (fp >= 1) { pin(flight.pts[0], '#ffd98a'); pin(flight.pts[flight.pts.length-1], '#ffd98a'); }
  }

  // --- playback: replay on demand so it's fresh at talk time ---
  let start = null, running = false;
  const DURATION = 2400;

  function frame(ts) {
    if (start === null) start = ts;
    const p = Math.min(1, (ts - start) / DURATION);
    draw(1 - Math.pow(1 - p, 3));
    if (p < 1) requestAnimationFrame(frame);
    else running = false;
  }

  function play() {
    if (reduced) { draw(1); return; }
    start = null;
    if (!running) { running = true; requestAnimationFrame(frame); }
  }

  addEventListener('resize', () => { resize(); play(); });
  addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter' || e.key.toLowerCase() === 'r') { e.preventDefault(); play(); }
  });
  addEventListener('click', play);
  addEventListener('focus', play);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') play();
  });

  resize();
  play();
})();
</script>
</body>
</html>

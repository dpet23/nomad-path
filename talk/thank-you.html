<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — Nomad Path</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧭</text></svg>">
<style>
  :root {
    --night:  #14122c;
    --indigo: #2c1b4e;
    --plum:   #6d2a64;
    --rose:   #c23c69;
    --coral:  #ee6c4d;
    --amber:  #f4a93b;
    --gold:   #f4c96b;
    --sun:    #ffd98a;
    --cream:  #fbeeda;
    --teal:   #37c2b6;
    --ink:    #1a1330;

    --font-display: "Futura", "Century Gothic", "Avenir Next", ui-rounded,
                    system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
                  "Times New Roman", serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", "Fira Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(120% 70% at 50% 118%, rgba(255,217,138,.55) 0%, rgba(255,217,138,0) 45%),
      linear-gradient(180deg,
        var(--night)  0%,
        var(--indigo) 24%,
        var(--plum)   47%,
        var(--rose)   66%,
        var(--coral)  80%,
        var(--amber)  92%,
        var(--gold)  100%);
    color: var(--cream);
    font-family: var(--font-sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    cursor: default;
  }

  .rays {
    position: fixed;
    left: 50%; bottom: -8vmin;
    width: 160vmax; height: 160vmax;
    transform: translateX(-50%);
    background: repeating-conic-gradient(from 90deg at 50% 100%,
      rgba(255,224,168,.10) 0deg 4deg, rgba(255,224,168,0) 4deg 12deg);
    -webkit-mask-image: radial-gradient(60% 60% at 50% 100%, #000 0%, transparent 72%);
            mask-image: radial-gradient(60% 60% at 50% 100%, #000 0%, transparent 72%);
    pointer-events: none;
    z-index: 0;
    animation: shimmer 14s ease-in-out infinite alternate;
  }
  @keyframes shimmer { from { opacity: .75; } to { opacity: 1; } }

  .scrim {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(72% 55% at 50% 50%, rgba(16,12,34,.40), rgba(16,12,34,0) 75%);
  }

  #tracks {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .frame {
    position: fixed;
    inset: clamp(14px, 2.4vmin, 30px);
    border: 1.5px solid rgba(251,238,218,.85);
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    animation: fadeIn 1s ease .1s forwards;
  }
  .frame::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(251,238,218,.4);
  }
  .frame span {
    position: absolute;
    color: var(--cream);
    font-size: clamp(.7rem, 1.6vmin, 1rem);
    opacity: .8;
  }
  .frame .tl { top: 10px; left: 12px; }
  .frame .tr { top: 10px; right: 12px; }
  .frame .bl { bottom: 8px; left: 12px; }
  .frame .br { bottom: 8px; right: 12px; }

  .content {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8vmin 6vw;
    gap: clamp(.7rem, 1.8vmin, 1.4rem);
  }

  .eyebrow {
    font-family: var(--font-sans);
    font-weight: 600;
    letter-spacing: .46em;
    text-indent: .46em;
    font-size: clamp(.68rem, 1.7vw, 1.02rem);
    color: var(--gold);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 1.1em;
  }
  .eyebrow::before, .eyebrow::after {
    content: "";
    width: clamp(24px, 6vw, 74px);
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .eyebrow::after { background: linear-gradient(90deg, var(--gold), transparent); }

  .title {
    font-family: var(--font-display);
    font-weight: 800;
    text-transform: none;          /* a warm sign-off, not a shouted wordmark */
    letter-spacing: .03em;
    line-height: .95;
    font-size: clamp(2.6rem, 10vw, 8rem);
    margin: 0;
    color: var(--cream);
    text-shadow: 0 2px 30px rgba(20,10,40,.45), 0 1px 2px rgba(20,10,40,.5);
    text-wrap: balance;
  }

  .rule {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    color: var(--sun);
    font-size: clamp(1rem, 2.6vw, 1.7rem);
  }
  .rule::before, .rule::after {
    content: "";
    width: clamp(40px, 12vw, 150px);
    height: 1px;
    background: currentColor;
    opacity: .7;
  }

  .linkwrap {
    margin-top: clamp(.5rem, 1.6vmin, 1.1rem);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(.4rem, 1.2vmin, .8rem);
  }
  .link-label {
    font-family: var(--font-sans);
    font-weight: 700;
    letter-spacing: .34em;
    text-indent: .34em;
    font-size: clamp(.56rem, 1.35vw, .82rem);
    text-transform: uppercase;
    color: var(--gold);
  }
  .link {
    display: inline-flex;
    align-items: center;
    gap: .5em;
    font-family: var(--font-mono);
    font-size: clamp(.95rem, 2.5vw, 1.55rem);
    letter-spacing: .01em;
    color: var(--cream);
    text-shadow: 0 0 2px rgba(16,12,34,.9), 0 1px 3px rgba(16,12,34,.8);
    border-bottom: 2px solid rgba(255,217,138,.75);
    padding-bottom: .14em;
  }
  .link .mark { display: inline-flex; }
  .link .mark svg {
    width: 1.12em; height: 1.12em; display: block;
    fill: var(--sun);
    filter: drop-shadow(0 1px 2px rgba(16,12,34,.7));
  }

  /* QR sits on its own light card so it always has the contrast a scanner needs */
  .qr {
    background: #fbf3e6;
    padding: clamp(14px, 2.2vmin, 22px);   /* the light padding IS the QR quiet zone */
    border-radius: 10px;
    border: 1px solid rgba(255,217,138,.6);
    box-shadow: 0 8px 28px rgba(16,12,34,.45);
    line-height: 0;
  }
  .qr svg { width: clamp(104px, 15vmin, 150px); height: auto; display: block; }

  .byline {
    position: fixed;
    right: clamp(26px, 4vmin, 46px);
    bottom: clamp(22px, 3.4vmin, 40px);
    z-index: 3;
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 2rem;
    color: var(--ink);
    opacity: .85;
  }

  .reveal { opacity: 0; animation: riseIn .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay: .2s; }
  .d2 { animation-delay: .45s; }
  .d3 { animation-delay: .7s; }
  .d4 { animation-delay: 1.0s; }
  .d5 { animation-delay: 2.4s; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .reveal, .frame { animation: none; opacity: 1; }
    .rays { animation: none; }
  }
</style>
</head>

<!DOCTYPE html>
<html xmlns="https://www.w3.org/1999/xhtml" lang="en-GB">

<head>
    <title>Leaflet POC</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
        integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI=" crossorigin="" />

    <style>
        body {
            padding: 0;
            margin: 0;
        }

        html,
        body,
        #map {
            height: 100%;
            width: 100vw;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"
        integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM=" crossorigin=""></script>
    <script src="https://unpkg.com/Leaflet.MultiOptionsPolyline@1.0.0/Leaflet.MultiOptionsPolyline.js"></script>

    <script type="module">
        import createLeafletMap from "./map_leaflet.js";
        import { styleLineStringLayerHourOfDay, styleLineStringLayerAltitude, styleLineStringLayerSpeed } from "./layers-geojson.esm.js";

        // Define the available styles for GeoJSON LineStrings.
        const lineStringStyles = [
            {
                name: 'Hour of day (UTC)',
                func: styleLineStringLayerHourOfDay,
                thresholds: new Map([
                    // https://coolors.co/palette/03045e-023e8a-0077b6-0096c7-00b4d8-48cae4-90e0ef-ade8f4-caf0f8
                    // https://coolors.co/palette/03071e-370617-6a040f-9d0208-d00000-dc2f02-e85d04-f48c06-faa307-ffba08
                    [6, { color: '#03045E' }],
                    [7, { color: '#0077B6' }],
                    [8, { color: '#00B4D8' }],
                    [9, { color: '#FFBA08' }],
                    [10, { color: '#FAA307' }],
                    [11, { color: '#F48C06' }],
                    [12, { color: '#E85D04' }],
                    [13, { color: '#DC2F02' }],
                    [14, { color: '#D00000' }],
                    [15, { color: '#9D0208' }],
                    [16, { color: '#6A040F' }],
                    [17, { color: '#370617' }],
                    [18, { color: '#03071E' }],
                    [19, { color: '#000000' }],
                ]),
            },
            {
                name: 'Altitude (m)',
                func: styleLineStringLayerAltitude,
                thresholds: new Map([
                    // https://www.color-name.com/
                    [undefined, { color: '#000000' }], // Black
                    [30, { color: '#330072' }], // Cadbury Purple
                    [60, { color: '#0000FF' }], // Blue
                    [120, { color: '#0040FF' }], // Blue (RYB)
                    [180, { color: '#0080FF' }], // Azure
                    [240, { color: '#00FFB0' }], // Medium Spring Green
                    [300, { color: '#00E000' }], // Electric Green
                    [360, { color: '#80FF00' }], // Chartreuse (Web)
                    [420, { color: '#FFFF00' }], // Yellow
                    [480, { color: '#FFC000' }], // Amber
                    [540, { color: '#FF0000' }], // Red
                    ['max', { color: '#7C0D0E' }], // Deep Red
                ]),
            },
            {
                name: 'Speed (km/h)',
                func: styleLineStringLayerSpeed,
                thresholds: new Map([
                    // Walking
                    // https://huemint.com/gradient-9/#palette=ffea00-d0d201-c9d006-bec72b-84c918-53b42a-1b9c31-23d396-00ff58
                    [1, { color: '#ffea00' }],
                    [2, { color: '#d0d201' }],
                    [3, { color: '#c9d006' }],
                    [4, { color: '#bec72b' }],
                    [5, { color: '#84c918' }],
                    [6, { color: '#53b42a' }],
                    [7, { color: '#1b9c31' }],
                    [8, { color: '#23d396' }],
                    [9, { color: '#00ff59' }],

                    // Driving
                    // https://coolors.co/gradient-palette/1900ff-ff0000?number=16
                    [10, { color: '#1900FF' }],
                    [20, { color: '#2800EE' }],
                    [30, { color: '#3800DD' }],
                    [40, { color: '#4700CC' }],
                    [50, { color: '#5600BB' }],
                    [60, { color: '#6600AA' }],
                    [70, { color: '#750099' }],
                    [80, { color: '#840088' }],
                    [90, { color: '#940077' }],
                    [100, { color: '#A30066' }],
                    [110, { color: '#B20055' }],
                    [120, { color: '#C20044' }],
                    [130, { color: '#D10033' }],
                    [140, { color: '#E00022' }],
                    [150, { color: '#F00011' }],
                    [160, { color: '#FF0000' }],

                    // Other
                    ['max', { color: '#000000' }],
                ]),
            },
        ];

        // Create the Leaflet map.
        createLeafletMap({
            id: 'map',
            geojson: 'data/data.geojson',
            lineStringStyles,
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html xmlns="https://www.w3.org/1999/xhtml" lang="en-GB">

<head>
    <title>Leaflet POC</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
        integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI=" crossorigin="" />

    <style>
        body {
            padding: 0;
            margin: 0;
        }

        html,
        body,
        #map {
            height: 100%;
            width: 100vw;
        }

    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"
        integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM=" crossorigin=""></script>

    <script>
        // Define base map layers.
        layerOsm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution:
                '<a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        });
        layerGoogleHybridStatic = L.tileLayer(
            "http://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}",
            {
                // https://gis.stackexchange.com/a/341490
                maxZoom: 20,
                subdomains: ["mt0", "mt1", "mt2", "mt3"],
                attribution:
                    '<a href="https://www.google.com.au/maps">NASA, TerraMetrics, Google</a>',
            }
        );
        layerBlueMarble = L.tileLayer(
            "https://gibs-{s}.earthdata.nasa.gov/wmts/epsg3857/best/{layer}/default/{time}/{tileMatrixSet}/{z}/{y}/{x}.jpg",
            {
                layer: "BlueMarble_ShadedRelief_Bathymetry",
                tileMatrixSet: "EPSG3857_500m",
                time: "",
                maxZoom: 8,
                noWrap: true,
                continuousWorld: true,
                bounds: [
                    // Prevent Leaflet from retrieving non-existent tiles on the borders.
                    [-85.0511287776, -179.999999975],
                    [85.0511287776, 179.999999975],
                ],
                attribution:
                    '<a href="https://wiki.earthdata.nasa.gov/display/GIBS">NASA EOSDIS GIBS</a>',
            }
        );

        // Define a layer for the stops.
        var layerIcons = L.layerGroup();

        // Define a layer for the tracks.
        var layerTracks = new L.LayerGroup();

        // Read a GeoJSON file, processing each Feature individually.
        // Docs: https://leafletjs.com/reference.html#geojson
        var optionsGeojson = {
            maxZoom: 20,
            tolerance: 3,
            debug: 0,
            style: {
                color: "#000000",
            },
        };
        fetch("data.geojson").then(httpRes => httpRes.json()).then(jsonData => {
            L.geoJSON(jsonData, {
                ...optionsGeojson,
                onEachFeature: (jsonFeature, geoJsonLayer) => {
                    // console.log(jsonFeature, geoJsonLayer);

                    // Add the GeoJSON Feature name and date as a tooltip.
                    const featureDateStr = new Date(jsonFeature.properties.date).toLocaleDateString(
                        'en-GB',
                        { weekday: "long", year: "numeric", month: "long", day: "numeric" }
                    );
                    const tooltip = `<strong>${jsonFeature.properties.name}</strong><br/>${featureDateStr}`;
                    geoJsonLayer.bindTooltip(tooltip);

                    // Add the Feature to an existing LayerGroup.
                    switch (jsonFeature.geometry.type) {
                        case 'Point':
                            geoJsonLayer.addTo(layerIcons);
                            break;

                        case 'LineString':
                        case 'MultiLineString':
                            switch (jsonFeature.properties.transport[0]) {
                                // Change track colour based on transport mode.
                                // https://coolors.co/palette/ff595e-ffca3a-8ac926-1982c4-6a4c93
                                case 'Driving':
                                    geoJsonLayer.setStyle({ color: "#6A4C93" }); // dark moderate violet
                                    break;
                                case 'Passenger':
                                    geoJsonLayer.setStyle({ color: "#1982C4" }); // strong blue
                                    break;
                                case 'Public transport':
                                    geoJsonLayer.setStyle({ color: "#8AC926" }); // strong green
                                    break;
                                case 'Walking':
                                    geoJsonLayer.setStyle({ color: "#FFCA3A" }); // light orange
                                    break;
                                case 'Tourist activity':
                                    geoJsonLayer.setStyle({ color: "#FF595E" }); // light red
                                    break;
                            }
                            geoJsonLayer.addTo(layerTracks);

                            break;
                    }
                }
            });
        });

        // Initialize the map.
        var map = L.map("map", {
            center: [0, 0],
            zoom: 3,
            layers: [layerBlueMarble, layerTracks, layerIcons],
            worldCopyJump: true,
        });

        // Layer control.
        var baseMaps = {
            "NASA Blue Marble": layerBlueMarble,
            "Google Hybrid (static)": layerGoogleHybridStatic,
            "OpenStreetMap": layerOsm,
        };
        var overlayMaps = {
            "Tracks": layerTracks,
            "Stops": layerIcons,
        };
        var layerControl = L.control.layers(baseMaps, overlayMaps).addTo(map);

        // Scale control.
        L.control.scale({ metric: true, imperial: true }).addTo(map);

        // Reset map control.
        (function () {
            var control = new L.Control({ position: "topleft" });
            control.onAdd = function (map) {
                var resetView = L.DomUtil.create("a", "resetview");
                resetView.innerHTML = "[Reset Map]";
                L.DomEvent.disableClickPropagation(resetView).addListener(
                    resetView,
                    "click",
                    function () {
                        map.setView(map.options.center, map.options.zoom);
                    },
                    resetView
                );
                return resetView;
            };
            return control;
        })().addTo(map);
    </script>
</body>

</html>

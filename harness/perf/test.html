<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NomadPath Perf Harness</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; height: 100vh; }
        #map { flex: 1; }
        #error { display: none; color: red; padding: 1rem; font-family: monospace; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="/dist/nomad-path.css" />
</head>
<body>
<div id="map"></div>
<div id="error"></div>

<!--
  Perf harness page. Loads the PROFILING bundle (nomad-path.profiling.js) so the
  characterization perf test can read the library's performance.measure entries
  via page.evaluate. The prod bundle has these stripped, so the perf seam can
  only be observed against the profiling build.
-->
<script type="module">
import { NomadPath } from '/dist/nomad-path.profiling.js';

try {
    const nomadMap = await NomadPath.create({
        container: 'map',
        dataUrls: ['/fixture.geojson'],
        defaultBasemap: 'osm',
        initialBounds: 'auto',
    });

    // Expose globals for the perf spec to drive operations and read marks.
    window.nomadMap = nomadMap;
    window._map = nomadMap._map;
    window.nomadMapReady = true;

} catch (err) {
    const el = document.getElementById('error');
    el.style.display = 'block';
    el.textContent = err.message;
    window.nomadMapError = err.message;
    console.error(err);
}
</script>
</body>
</html>

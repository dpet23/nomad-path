<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nomad Path — Demo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }

        #toolbar {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 14px; background: #1a1a2e; color: #eee; flex-shrink: 0;
        }
        #toolbar h1 { font-size: 1rem; font-weight: 600; }

        #stage { flex: 1; position: relative; }
        #map { position: absolute; inset: 0; }

        #status {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            color: #fff; padding: 6px 14px;
            border-radius: 20px; font-size: 0.82rem; pointer-events: none;
            display: none;
        }
        #status.status--info  { background: #1a1a2e; }
        #status.status--error { background: rgba(176,32,42,0.92); }
    </style>
</head>
<body>
<div id="toolbar">
    <h1>Nomad Path</h1>
</div>

<div id="stage">
    <div id="map"></div>
    <div id="status">Loading…</div>
</div>

<!-- MapLibre CSS (needed for map controls) -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
<link rel="stylesheet" href="../dist/nomad-path.css" />
<link rel="stylesheet" href="./profiling-widget.css" />

<script type="module">
// ---------------------------------------------------------------------------
// CONFIG — edit DATA_URLS to point to your trip-data.geojson file(s)
// ---------------------------------------------------------------------------
const DATA_URLS = [
    './trip-data.geojson',
];

// ---------------------------------------------------------------------------
// Bootstrap
// ---------------------------------------------------------------------------
import { NomadPath, BASEMAPS } from '../dist/nomad-path.profiling.js';
import { mountProfilingWidget } from './profiling-widget.js';

const status = document.getElementById('status');
const show = (msg, kind = 'info') => {
    status.className = `status--${kind}`;
    status.style.display = 'block';
    status.textContent = msg;
};
const hide = () => { status.style.display = 'none'; };

// Mount BEFORE create() so the observer captures the initial load/ingest marks.
mountProfilingWidget(document.getElementById('toolbar'));

let nomadMap;
try {
    show('Loading trip data…');
    nomadMap = await NomadPath.create({
        container: 'map',
        dataUrls: DATA_URLS,
        defaultBasemap: 'osm',
        initialBounds: 'auto',
    });
    hide();

    // Expose on window for browser console debugging
    window.nomadMap = nomadMap;

    // If any loaded trip has a name, surface it in the page title and toolbar.
    const names = [];
    for (const trip of nomadMap.trips) {
        const name = trip.metadata?.tripName;
        if (name && !names.includes(name)) names.push(name);
    }
    if (names.length) {
        const combined = names.join(' / ');
        document.title = combined;
        document.querySelector('#toolbar h1').textContent = combined;
    }

    // Log trip summary to console
    for (const trip of nomadMap.trips) {
        const tracks = trip.features.filter(f => f.properties.type === 'track');
        const pois   = trip.features.filter(f => f.properties.type === 'poi');
        console.info(`[${trip.metadata.tripName}] ${tracks.length} tracks, ${pois.length} POIs`);
        console.info('  Attribute ranges:', trip.metadata.attributeRanges);
    }
} catch (err) {
    show(`Error: ${err.message}`, 'error');
    console.error(err);
}

</script>
</body>
</html>
